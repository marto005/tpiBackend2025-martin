server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        # RUTA A ORDERS
        - id: orders-service
          uri: http://orders-service:8101
          predicates:
            - Path=/orders/**
          filters:
            - StripPrefix=1

        # RUTA A FLEET
        - id: fleet-service
          uri: http://fleet-service:8102
          predicates:
            - Path=/fleet/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
